<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Golf Button">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="theme-color" content="#10231a">
<meta name="description" content="Press a big red button and get a club to hit. A driving range tool that stops you grinding the same club forty times, and can play you a round from the mat.">
<link rel="canonical" href="https://golfbutton.app/">
<meta property="og:type" content="website">
<meta property="og:url" content="https://golfbutton.app/">
<meta property="og:title" content="Golf Button">
<meta property="og:description" content="Press a big red button, get a club to hit. Varied range practice, or a whole round from the mat.">
<meta property="og:image" content="https://golfbutton.app/og.png">
<meta name="twitter:card" content="summary_large_image">
<link rel="manifest" href="/manifest.webmanifest">
<link rel="apple-touch-icon" href="/apple-touch-icon.png">
<link rel="icon" href="/icon-192.png" type="image/png">
<title>Golf Button</title>
<style>
  :root {
    /* Twilight fairway: deep turf ground, scorecard cream ink, flag red button. */
    --bg: #10231a;
    --sheet: #142b1d;
    --row: #1d3b28;
    --line: #2b5138;
    --fg: #f4f0e4;
    --muted: #8ea795;
    --red: #e0202a;
    --red-dark: #9c0f17;
    --red-shadow: #61080e;
    --accent: #efe6cf;
    --accent-ink: #12291b;
  }
  /* touch-action on html/body alone still let descendants take a double-tap zoom,
     which rapid pressing triggers constantly now that the whole screen advances. */
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; touch-action: manipulation; }
  html { -webkit-text-size-adjust: 100%; text-size-adjust: 100%; }
  html, body {
    margin: 0; height: 100%;
    background: var(--bg); color: var(--fg);
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    touch-action: manipulation;
    -webkit-user-select: none; user-select: none;
    overscroll-behavior: none;
  }

  main {
    height: 100%; min-height: 100vh; min-height: 100dvh;
    display: flex; flex-direction: column; align-items: center; justify-content: space-evenly;
    padding: max(16px, env(safe-area-inset-top)) 16px max(16px, env(safe-area-inset-bottom));
  }

  #readout { display: flex; flex-direction: column; align-items: center; gap: 14px; min-height: 9rem; justify-content: center; }

  /* Scorecard strip: the hole you are standing on, printed like a card. */
  #card {
    display: grid; grid-template-columns: repeat(3, 1fr);
    width: min(76vw, 268px);
    background: var(--accent); color: var(--accent-ink);
    border-radius: 3px; overflow: hidden;
    box-shadow: 0 2px 12px rgba(0,0,0,.4);
  }
  #card[hidden] { display: none; }
  #card .cell { padding: 5px 4px 7px; text-align: center; }
  #card .cell + .cell { border-left: 1px solid rgba(18,41,27,.20); }
  #card .k { display: block; font-size: .56rem; font-weight: 700; letter-spacing: .14em; text-transform: uppercase; opacity: .6; }
  #card .v { display: block; font-size: 1.4rem; font-weight: 800; line-height: 1.15; font-variant-numeric: tabular-nums; }
  #club {
    font-size: clamp(2.4rem, 12vw, 5rem);
    font-weight: 800; line-height: 1.05; text-align: center;
    letter-spacing: -0.02em;
  }
  #club.placeholder { color: var(--muted); font-weight: 600; font-size: clamp(1.4rem, 6vw, 2.2rem); }
  #context {
    display: flex; flex-direction: column; align-items: center; gap: 3px;
    text-align: center; font-variant-numeric: tabular-nums;
  }
  #context .shot { color: var(--fg); font-size: clamp(1.05rem, 4.6vw, 1.4rem); font-weight: 700; }

  #big {
    --size: min(70vmin, 320px);
    width: var(--size); height: var(--size);
    border-radius: 50%; border: none; cursor: pointer;
    background: radial-gradient(circle at 35% 30%, #ff5a62, var(--red) 55%, var(--red-dark));
    box-shadow: 0 14px 0 var(--red-shadow), 0 22px 40px rgba(0,0,0,.6);
    transition: transform .08s ease, box-shadow .08s ease, filter .2s;
    outline: none;
    color: #fff; font-weight: 800; text-transform: uppercase; letter-spacing: .06em;
    font-size: clamp(1.3rem, 6vw, 2rem);
    text-shadow: 0 2px 6px rgba(0,0,0,.45);
    font-family: inherit;
  }
  #big:active, #big.pressed {
    transform: translateY(10px);
    box-shadow: 0 4px 0 var(--red-shadow), 0 8px 20px rgba(0,0,0,.6);
  }
  #big:disabled {
    filter: grayscale(.8) brightness(.5); cursor: not-allowed;
    transform: none; box-shadow: 0 14px 0 var(--line);
  }

  #gear {
    position: fixed; top: max(12px, env(safe-area-inset-top)); right: 12px;
    width: 48px; height: 48px; border-radius: 50%;
    background: rgba(244,240,228,.10); color: var(--fg); border: none;
    font-size: 26px; line-height: 1; cursor: pointer;
    display: flex; align-items: center; justify-content: center;
  }
  #gear:active { background: rgba(244,240,228,.22); }

  /* Settings sheet */
  #settings { position: fixed; inset: 0; background: var(--sheet); display: flex; flex-direction: column; z-index: 10; }
  #settings[hidden] { display: none; }
  #settings header {
    display: flex; align-items: center; justify-content: space-between;
    padding: max(10px, env(safe-area-inset-top)) 14px 10px;
    border-bottom: 1px solid var(--line);
  }
  #settings h1 { font-size: 1.1rem; margin: 0; }
  #close {
    background: var(--accent); color: var(--accent-ink); border: none; border-radius: 999px;
    padding: 8px 16px; font-size: .95rem; font-weight: 700; cursor: pointer;
  }
  #groups { overflow-y: auto; -webkit-overflow-scrolling: touch; flex: 1; padding: 4px 14px max(20px, env(safe-area-inset-bottom)); }

  .group { margin: 12px 0 6px; }
  .group-head { display: flex; align-items: baseline; justify-content: space-between; margin-bottom: 6px; }
  .group-head h2 { font-size: .8rem; text-transform: uppercase; letter-spacing: .08em; color: var(--muted); margin: 0; }
  .group-head span button { background: none; border: none; color: var(--accent); font-size: .85rem; cursor: pointer; padding: 2px 6px; }

  .mode-set { font-size: .56rem; font-weight: 700; letter-spacing: .14em; text-transform: uppercase;
              color: var(--muted); opacity: .8; margin: 8px 0 4px; }
  .modegrid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 6px; }
  .modegrid label { position: relative; cursor: pointer; }
  .modegrid input { position: absolute; opacity: 0; width: 0; height: 0; }
  .mface {
    display: flex; align-items: center; justify-content: center; text-align: center;
    height: 38px; padding: 0 4px; border-radius: 9px; line-height: 1.15;
    font-size: .8rem; font-weight: 600;
    background: var(--row); color: var(--muted); border: 1px solid transparent;
  }
  .modegrid input:checked + .mface { background: var(--accent); color: var(--accent-ink); }
  .modegrid input:focus-visible + .mface { border-color: var(--fg); }
  .mode-note { color: var(--muted); font-size: .78rem; line-height: 1.3; margin: 8px 0 0; min-height: 2.6em; }

  .chips { display: grid; grid-template-columns: repeat(auto-fill, minmax(78px, 1fr)); gap: 6px; }
  label.chip { position: relative; cursor: pointer; }
  label.chip input { position: absolute; opacity: 0; width: 0; height: 0; }
  .face {
    display: flex; align-items: baseline; justify-content: center; gap: 5px;
    height: 38px; border-radius: 9px; font-size: .95rem; font-weight: 600;
    background: var(--row); color: var(--muted); border: 1px solid transparent;
    padding-top: 9px;
  }
  .face .yds { font-size: .7rem; font-weight: 500; opacity: .6; font-variant-numeric: tabular-nums; }
  label.chip input:checked + .face { background: var(--accent); color: var(--accent-ink); }
  label.chip input:checked + .face .yds { opacity: .75; }
  label.chip input:focus-visible + .face { border-color: var(--fg); }

  .dist + .dist { margin-top: 6px; }
  .dist { display: flex; align-items: center; justify-content: space-between; gap: 8px; background: var(--row); border-radius: 9px; padding: 8px 10px; }
  .dist .lbl { font-size: .95rem; }
  .dist .lbl small { display: block; color: var(--muted); font-size: .75rem; line-height: 1.2; }
  .dist .ctl { display: flex; align-items: center; gap: 6px; flex: none; }
  .dist .ctl button { width: 34px; height: 34px; border-radius: 8px; border: 1px solid var(--line); background: transparent; color: var(--fg); font-size: 1.15rem; line-height: 1; cursor: pointer; font-family: inherit; }
  .dist .ctl button:active { background: var(--line); }
  .dist input { width: 62px; background: var(--bg); color: var(--fg); border: 1px solid var(--line); border-radius: 8px; padding: 7px 4px; text-align: center; font-size: 1rem; font-family: inherit; font-variant-numeric: tabular-nums; }

  #reset { width: 100%; margin: 12px 0 0; padding: 10px; border-radius: 9px; background: transparent; color: var(--fg); border: 1px solid var(--line); font-size: .95rem; cursor: pointer; font-family: inherit; }
  #summary { color: var(--muted); font-size: .85rem; margin: 8px 0 0; text-align: center; }
  .why { display: block; text-align: center; color: var(--muted); font-size: .85rem; margin: 14px 0 0; }
</style>
</head>
<body>

<main>
  <div id="readout">
    <div id="card" hidden></div>
    <div id="club" class="placeholder" aria-live="polite">Press for a club</div>
    <div id="context"></div>
  </div>
  <button id="big" aria-label="Next club">Next Club</button>
  <button id="gear" aria-label="Settings">&#9881;</button>
</main>

<section id="settings" hidden aria-label="Settings">
  <header>
    <h1>Settings</h1>
    <button id="close">Done</button>
  </header>
  <div id="groups"></div>
</section>

<script src="/logic.js"></script>
<script src="/app.js"></script>

<script>
  // Offline support. Ranges have bad signal; the app should not need any.
  if ('serviceWorker' in navigator && location.protocol === 'https:') {
    window.addEventListener('load', () => {
      navigator.serviceWorker.register('/sw.js').catch(() => {});
    });
  }
</script>

<!-- GoatCounter: privacy friendly, no cookies. Skips localhost automatically. -->
<script data-goatcounter="https://golfbutton.goatcounter.com/count"
        async src="https://gc.zgo.at/count.js"></script>
</body>
</html>
